name: MLOps_CI_Workflow
on: 
  push: 
    branches: 
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the data processing tests
        run: |
          python src/data/run_processing.py --input data/raw/house_data.csv --output data/processed/cleaned_house_data.csv

      - name: Run the feature engineering tests
        run: |
          python src/features/engineer.py \
          --input data/processed/cleaned_house_data.csv \
          --output data/processed/feature_house_data.csv \
          --preprocessor models/preprocessor.pkl
      - name: Commit processed data
        run: |
          git config --global user.name "srinivas30240"
          git config --global user.email "srinivas.boga@gmail.com"
          git add data/processed/cleaned_house_data.csv data/processed/feature_house_data.csv
          git commit -m "Add processed datasets"
          git push